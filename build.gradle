plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/ManyFlowers.accesswidener")
}

repositories {
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://maven.terraformersmc.com/" }
    mavenCentral()
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${project.minecraft_version}")
    mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
    modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")

    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
    modImplementation("dev.isxander:yet-another-config-lib:${project.yacl_version}")
    modImplementation("net.fabricmc:fabric-language-kotlin:${project.kotlin_fabric}")
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    include(modImplementation("maven.modrinth:ducky-updater-lib:${project.ducky_updater}"))
    include(modImplementation("maven.modrinth:fstats:${project.fstats}"))
}

processResources {
    inputs.property "version", project.mod_version
    inputs.property "fabricloader", project.loader_version
    inputs.property "fabric-api", project.fabric_version
    inputs.property "minecraft", project.minecraft_version
    inputs.property "java", JavaVersion.VERSION_21
    inputs.property "fstats", project.fstats
    inputs.property "ducky-updater-lib", project.ducky_updater
    inputs.property "fabric-language-kotlin", project.kotlin_fabric
    inputs.property "modmenu", project.modmenu_version


    filesMatching("fabric.mod.json") {
        expand([
        "mod_version": project.mod_version,
        "loader_version": project.loader_version,
        "fabric_version": project.fabric_version,
        "minecraft_version": project.minecraft_version,
        "java_version": JavaVersion.VERSION_21,
        "fstats_version": project.fstats,
        "ducky_updater_version": project.ducky_updater,
        "kotlin_fabric": project.kotlin_fabric,
        "modmenu_version": project.modmenu_version
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
kotlin {
    jvmToolchain(21)
}